
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>IndiaBIX | Private Learning Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* PASSWORD SCREEN */
#login {
    width: 100%;
    height: 100%;
    background: #fff;
    color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 90%;
    max-width: 350px;
    text-align: center;
}

.login-box h2 {
    font-size: 25px;
    font-weight: 500;
    margin-bottom: 10px;
}

.login-box p {
    font-size: 13px;
    color: #555;
    margin-bottom: 25px;
}

.login-box input {
    width: 100%;
    height: 48px;
    border: 1px solid #000;
    padding: 12px;
    text-align: center;
    font-size: 16px;
    outline: none;
    margin-bottom: 12px;
}

.login-box button {
    width: 100%;
    height: 48px;
    background: #000;
    color: #fff;
    border: 1px solid #000;
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 2px;
}

.login-box button:hover {
    background: #fff;
    color: #000;
}

#error {
    color: #c00;
    font-size: 12px;
    margin-top: 12px;
}

/* INDIABIX PAGE */
#portal {
    display: none;
    width: 100%;
    height: 100%;
    background: #fff;
    flex-direction: column;
}

.header {
    width: 100%;
    height: 38px;
    min-height: 38px;
    background: #000;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
}

.header span {
    font-size: 13px;
    letter-spacing: 2px;
}

.header button {
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 11px;
}

.header button:hover {
    background: #fff;
    color: #000;
}

.frame {
    flex: 1;
    width: 100%;
    min-height: 0;
}

.frame iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* MOBILE */
@media(max-width: 500px) {
    .header {
        height: 35px;
        min-height: 35px;
    }

    .header span {
        font-size: 11px;
    }

    .header button {
        padding: 4px 7px;
        font-size: 10px;
    }
}
</style>
</head>

<body>

<!-- PASSWORD PROTECTION -->
<section id="login">
    <div class="login-box">
        <h2>HI</h2>
        <p>How are you???</p>

        <form id="loginForm">
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button type="submit">ENTER</button>
        </form>

        <div id="error"></div>
    </div>
</section>

<!-- INDIA BIX EMBEDDED PAGE -->
<section id="portal">

    <header class="header">
        <span>INDIABIX</span>

        <div>
            <button onclick="refreshPage()">↻ Refresh</button>
            <button onclick="logout()">Logout</button>
            <button onclick="openWebsite()">↗</button>
        </div>
    </header>

    <main class="frame">
        <iframe
            id="indiaFrame"
            src="https://www.indiabix.com/"
            title="IndiaBIX Learning Website"
            allowfullscreen>
        </iframe>
    </main>

</section>

<script>
const ACCESS_CODE = "NPL2026";

const login = document.getElementById("login");
const portal = document.getElementById("portal");
const form = document.getElementById("loginForm");

function showPortal() {
    login.style.display = "none";
    portal.style.display = "flex";
}

form.addEventListener("submit", function(e) {
    e.preventDefault();

    const password =
        document.getElementById("password").value;

    if (password === ACCESS_CODE) {
        sessionStorage.setItem("indiaBixAccess", "true");
        showPortal();
    } else {
        document.getElementById("error").textContent =
            "Incorrect password. Try again.";

        document.getElementById("password").value = "";
    }
});

function refreshPage() {
    document.getElementById("indiaFrame").src =
        "https://www.indiabix.com/";
}

function openWebsite() {
    window.open(
        "https://www.indiabix.com/",
        "_blank",
        "noopener,noreferrer"
    );
}

function logout() {
    sessionStorage.removeItem("indiaBixAccess");
    portal.style.display = "none";
    login.style.display = "flex";
    document.getElementById("password").value = "";
}

if (sessionStorage.getItem("indiaBixAccess") === "true") {
    showPortal();
}
</script>

</body>
</html>
